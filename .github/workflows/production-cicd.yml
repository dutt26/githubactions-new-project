name: Enterprise AWS CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  security-events: write
  packages: write
  actions: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

  AWS_REGION: ap-south-1

  ECR_REPOSITORY: zomato

  ECS_CLUSTER: netflix-cluster

  ECS_SERVICE: zomato-service

  CONTAINER_NAME: netflix

jobs:

###########################################################
# Unit Test
###########################################################

  unit-tests:

    name: Unit Tests

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

###########################################################
# CodeQL
###########################################################

  codeql:

    name: Static Code Analysis

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4

###########################################################
# Build + Scan
###########################################################

  build:

    name: Build Docker Image

    needs:
      - unit-tests
      - codeql

    runs-on: ubuntu-latest

    timeout-minutes: 30

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:

      - uses: actions/checkout@v4

      #######################################
      # Configure AWS
      #######################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      #######################################
      # Login to ECR
      #######################################

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      #######################################
      # Docker Buildx
      #######################################

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      #######################################
      # Build Image
      #######################################

      - name: Build Docker Image

        id: meta

        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |

          docker build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t $REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG \
            -t $REGISTRY/${{ env.ECR_REPOSITORY }}:latest .

          echo "image=$REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_OUTPUT

      #######################################
      # Filesystem Scan
      #######################################

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif

      #######################################
      # Container Scan
      #######################################

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image.sarif

      #######################################
      # Upload Scan Results
      #######################################

      - name: Upload Filesystem Scan
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

      - name: Upload Image Scan
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif

      #######################################
      # Push Image
      #######################################

      - name: Push Docker Image

        run: |

          docker push ${{ steps.meta.outputs.image }}

          docker push \
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

###########################################################
# Deploy
###########################################################

  deploy:

    name: Deploy to Amazon ECS

    needs: build

    runs-on: ubuntu-latest

    timeout-minutes: 30

    environment: production

    steps:

      - uses: actions/checkout@v4

      #######################################
      # Configure AWS
      #######################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      #######################################
      # Render Task Definition
      #######################################

      - name: Render ECS Task Definition

        id: task-definition

        uses: aws-actions/amazon-ecs-render-task-definition@v1

        with:

          task-definition: task-definition.json

          container-name: ${{ env.CONTAINER_NAME }}

          image: ${{ needs.build.outputs.image }}

      #######################################
      # Deploy
      #######################################

      - name: Deploy to ECS

        uses: aws-actions/amazon-ecs-deploy-task-definition@v2

        with:

          task-definition: ${{ steps.task-definition.outputs.task-definition }}

          cluster: ${{ env.ECS_CLUSTER }}

          service: ${{ env.ECS_SERVICE }}

          wait-for-service-stability: true

          wait-for-minutes: 15
